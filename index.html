<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>BIG EV | CARD GENERATOR 3.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap");

      * {
        margin: 0;
        padding: 0;
        font-family: "Roboto", sans-serif;
      }

      body {
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ====== FORM ====== */

      .form {
        width: 700px;
        background: linear-gradient(to bottom, #dfdbe2, #e7e5e9);
        margin: 10px;
        border-radius: 8px;
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .form-title{
        text-align: center;
        border: 2px solid #00cece;
        background-color: #00cece24;
        padding: 10px;
        margin: 10px;
        border-radius: 6px;
        display:flex;
        flex-direction: column;
        gap:10px;
      }

      .form label {
        color: #0b0b0b;
        font-size: 12px;
        font-weight: 700;
      }

      .input-adm {
        height: 22px;
        padding: 4px;
        border-radius: 3px;
        border: none;
      }

      .row {
        display: flex;
        gap: 10px;
      }

      .column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .btn {
        display: flex;
        gap: 10px;
      }

      button {
        padding: 10px 20px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        transition: all 0.25s ease-in-out;
      }

      button:hover {
        transform: translateY(-4px);
      }

      .btn-add {
        background-color: #2702f9;
        color: #fff;
      }

      .btn-print {
        background-color: #014621;
        color: #e8e3e8;
      }

      .btn-clear {
        background-color: #bb0000;
        color: #fff;
      }

      /* ====== CARD ====== */

      .content {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .card {
        width: 680px; /* Ajustado para caber na largura do A4 com margens */
        height: 190px; /* Reduzido levemente para garantir 4 por página */
        display: flex;
        border: 1px solid #000;
        page-break-inside: avoid; /* Evita que o card quebre entre duas páginas */
        margin-bottom: 15px;
      }

      .card-front,
      .card-back {
        width: 50%;
        padding: 10px;
      }

      .card-front {
        border-right: 1px solid #000;
      }

      .card-front-header {
        background: linear-gradient(263deg, #ffffff 35%, #9db8dd 100%);
        color: #211f1f;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px;
      }

      .card-front-body {
        margin-top: 20px;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .card-back {
        font-size: 10px;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        align-items: center;
        padding: 10px;
        text-align: center;
      }

      .card-back .direitos {
        text-align: justify;
        font-size: 9px;
        line-height: 1.2;
        margin-bottom: 5px;
      }

      .direitos-texto {
        font-size: 9px;
        text-align: justify;
        line-height: 1.1;
      }

      .qrcode-container {
        margin-top: 5px;
      }

      /* ====== PRINT ====== */

      @page {
        size: A4;
        margin: 5mm; /* sangria */
      }

      @media print {
        body {
          margin: 0;
        }
        .form {
          display: none;
        }
        .card {
          border: 1px dotted #666;
        } /* Pontilhado para facilitar o corte */
      }
    </style>
  </head>

  <body>
    <section class="form" id="form">
        <div class="form-title">
        <h1>BIG EV | CARD GENERATOR</h1>
        <p>Gerador de Carteirinhas de Prioridade</p>
        </div>
      <div class="column">
        <label>LOGO (URL)</label>
        <input class="input-adm" id="logo" />
      </div>

      <div class="column">
        <label>NÚMERO DA LEI</label>
        <input class="input-adm" id="lei" />
      </div>

      <div class="column">
        <label>NOME COMPLETO</label>
        <input class="input-adm" id="nome" />
      </div>

      <div class="row">
        <div class="column">
          <label>CPF</label>
          <input class="input-adm" id="cpf" maxlength="14" />
        </div>
        <div class="column">
          <label>DATA NASCIMENTO</label>
          <input class="input-adm" id="dn" maxlength="10" />
        </div>
      </div>

      <div class="btn">
        <button onclick="addItem()" class="btn-add">GERAR CARTEIRINHA</button>
        <button onclick="window.print()" class="btn-print">
          IMPRIMIR / PDF
        </button>
        <button onclick="clearCards()" class="btn-clear">LIMPAR TUDO</button>
      </div>
    </section>

    <section class="content" id="content"></section>

    <script>
      function maskCPF(v) {
        v = v.replace(/\D/g, "").slice(0, 11);
        v = v
          .replace(/(\d{3})(\d)/, "$1.$2")
          .replace(/(\d{3})(\d)/, "$1.$2")
          .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        return v;
      }

      function validarCPF(cpf) {
        cpf = cpf.replace(/\D/g, "");
        if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
        let s = 0;
        for (let i = 0; i < 9; i++) s += cpf[i] * (10 - i);
        let d1 = ((s * 10) % 11) % 10;
        s = 0;
        for (let i = 0; i < 10; i++) s += cpf[i] * (11 - i);
        let d2 = ((s * 10) % 11) % 10;
        return d1 == cpf[9] && d2 == cpf[10];
      }

      cpf.oninput = (e) => (e.target.value = maskCPF(e.target.value));

      dn.oninput = (e) => {
        let v = e.target.value.replace(/\D/g, "").slice(0, 8);
        v = v.replace(/(\d{2})(\d)/, "$1/$2").replace(/(\d{2})(\d)/, "$1/$2");
        e.target.value = v;
      };

      function clearCards() {
        if (confirm("Deseja remover todas as carteirinhas geradas?")) {
          document.getElementById("content").innerHTML = "";
        }
      }

      function addItem() {
        // Validação de inputs
        if (!nome.value || !cpf.value || !dn.value) {
          alert("Por favor, preencha todos os campos.");
          return;
        }

        if (!validarCPF(cpf.value)) {
          alert("CPF inválido");
          return;
        }

        // Criar o container do card
        const card = document.createElement("div");
        card.className = "card";

        // Montar o HTML (removendo IDs e usando classes para evitar conflitos)
        card.innerHTML = `
    <div class="card-front">
      <div class="card-front-header">
        <img src="${
          logo.value
        }" width="50" style="border-radius:3px;" onerror="this.src='https://via.placeholder.com/50?text=LOGO'">
        <div>
          <strong style="font-size: 14px;">CARTEIRINHA DE PRIORIDADE</strong><br>
          <small>${lei.value || "Lei Municipal/Federal"}</small>
        </div>
      </div>
      <div class="card-front-body">
        <p><strong>NOME:</strong> ${nome.value.toUpperCase()}</p>
        <p><strong>CPF:</strong> ${cpf.value}</p>
        <p><strong>NASCIMENTO:</strong> ${dn.value}</p>
      </div>
    </div>
    <div class="card-back">
      <div class="direitos-texto">
        <strong>DIREITOS E BENEFÍCIOS:</strong><br>
        O titular deste documento possui direito a atendimento prioritário imediato e diferenciado em repartições públicas, instituições financeiras e estabelecimentos comerciais, conforme previsto na legislação vigente.
      </div>
      <div class="qr-target" style="margin-top:5px; display: flex; justify-content: center;"></div>
      <p style="font-size: 8px; margin-top: 5px;">Válido em todo território nacional com documento oficial com foto.</p>
    </div>
    `;

        // Adicionar ao conteúdo
        const content = document.getElementById("content");
        content.appendChild(card);

        // Gerar o QR Code na div 'qr-target' deste card específico
        const qrContainer = card.querySelector(".qr-target");

        if (typeof QRCode !== "undefined") {
          new QRCode(qrContainer, {
            text: `TITULAR: ${nome.value.toUpperCase()} | CPF: ${
              cpf.value
            } | LEI: ${lei.value}`,
            width: 75,
            height: 75,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M,
          });
        } else {
          alert("Aguarde o carregamento da página ou verifique sua internet.");
        }
      }
    </script>
  </body>
</html>
